    --paper:#EAE6DA; --paper-dark:#DFDACB; --card:#F5F2E9;
    --ink:#20303D; --ink-soft:#5B6B75; --line:#C9C2AC;
    --seal:#7A2E2E; --seal-dark:#5E2222; --gold:#A9762F;

/* ---------------- Iconos (SVG simples, estilo lineal) ---------------- */
function Icon({ name, size = 16, color = "currentColor", sw = 1.8 }) {

  const shapes = {
    dashboard: <><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></>,
    building: <><rect x="4" y="2" width="16" height="20" rx="1"/><line x1="8" y1="7" x2="8" y2="7.5"/><line x1="12" y1="7" x2="12" y2="7.5"/><line x1="16" y1="7" x2="16" y2="7.5"/><line x1="8" y1="12" x2="8" y2="12.5"/><line x1="12" y1="12" x2="12" y2="12.5"/><line x1="16" y1="12" x2="16" y2="12.5"/><line x1="9" y1="22" x2="9" y2="17" /><line x1="15" y1="22" x2="15" y2="17"/><line x1="9" y1="17" x2="15" y2="17"/></>,
    users: <><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.3 2.5-5.5 5.5-5.5s5.5 2.2 5.5 5.5"/><circle cx="17" cy="8.5" r="2.4"/><path d="M15.8 14.7c2.6.3 4.7 2.4 4.7 5.3"/></>,
    clipboard: <><rect x="5" y="4" width="14" height="18" rx="1.5"/><rect x="8.5" y="2" width="7" height="3.5" rx="1"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="16" y2="15"/></>,
    download: <><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><line x1="5" y1="21" x2="19" y2="21"/></>,
    calendar: <><rect x="3.5" y="4.5" width="17" height="16" rx="1.5"/><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"/><line x1="8" y1="2.5" x2="8" y2="6"/><line x1="16" y1="2.5" x2="16" y2="6"/><circle cx="15.5" cy="15" r="2.2"/><line x1="15.5" y1="13.8" x2="15.5" y2="15" /><line x1="15.5" y1="15" x2="16.4" y2="15.7"/></>,
    logout: <><path d="M9 21H5.5A1.5 1.5 0 0 1 4 19.5v-15A1.5 1.5 0 0 1 5.5 3H9"/><path d="M16 17l5-5-5-5"/><line x1="21" y1="12" x2="9" y2="12"/></>,
    x: <><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></>,
    plus: <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
    pencil: <><path d="M4 20l1-4.2L16 4.8a1.5 1.5 0 0 1 2.1 0l1.1 1.1a1.5 1.5 0 0 1 0 2.1L8.2 19 4 20z"/><line x1="14.5" y1="6.3" x2="17.7" y2="9.5"/></>,
    chevron: <path d="M9 5l7 7-7 7"/>,
    alert: <><path d="M12 3l10 18H2L12 3z"/><line x1="12" y1="9.5" x2="12" y2="14"/><circle cx="12" cy="17" r="0.7" fill={color} stroke="none"/></>,
    check: <><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></>,
    message: <><path d="M4 5.5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-4.5 3.5V17.5H4a1 1 0 0 1-1-1v-10a1 1 0 0 1 1-1z"/></>,
    clock: <><circle cx="12" cy="12" r="9"/><path d="M12 7v5.5l4 2.5"/></>,
    stamp: <><rect x="6" y="4" width="12" height="9" rx="1.5"/><path d="M9 13l-1.5 7h9L15 13"/><line x1="9" y1="17" x2="15" y2="17"/></>,
    sheet: <><rect x="4" y="3" width="16" height="18" rx="1.5"/><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="14" x2="20" y2="14"/><line x1="10" y1="9" x2="10" y2="21"/><line x1="15" y1="9" x2="15" y2="21"/></>,
    filetext: <><path d="M6 2.5h8l4 4V21a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1z"/><path d="M14 2.5V6.5h4"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="16" y2="16"/></>,
  };
  return <svg {...c}>{shapes[name] || null}</svg>;
}

  { id: "t-3", areaId: "secretarias", titulo: "Actualización de mesa de entradas digital", descripcion: "Migrar registro de expedientes a la nueva planilla unificada.", responsable: "Pablo Guzmán", criticidad: "baja", estado: "en_progreso", fechaLimite: addDays(20), avance: 40, comentarios: [], historial: [] },

  { id: "t-6", areaId: "compras", titulo: "Licitación de insumos de laboratorio", descripcion: "Pliego de licitación pública para reposición de insumos.", responsable: "Diego Salazar", criticidad: "alta", estado: "finalizada", fechaLimite: addDays(-5), avance: 100, comentarios: [], historial: [] },

];

const CRIT = {
  alta: { label: "Alta", color: "var(--alta)", bg: "var(--alta-bg)" },
  media: { label: "Media", color: "var(--media)", bg: "var(--media-bg)" },
  baja: { label: "Baja", color: "var(--baja)", bg: "var(--baja-bg)" },
};
const ESTADO = { pendiente: "Pendiente", en_progreso: "En curso", finalizada: "Finalizada" };

const uid = (p) => `${p}-${Date.now()}-${Math.floor(Math.random() * 9999)}`;
const fmtDate = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("es-AR", { day: "2-digit", month: "short", year: "numeric" });
const daysLeft = (iso) => Math.ceil((new Date(iso + "T00:00:00") - new Date(new Date().toDateString())) / 86400000);

/* ---------------- Persistencia (localStorage, funciona sin conexión) ---------------- */
const STORAGE_KEY = "unju-seguimiento-estado-v1";
function loadState() {
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function saveState(state) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

/* ---------------- Sub-componentes ---------------- */
function StampBadge({ crit, size = "normal" }) {
  const c = CRIT[crit];
  return <span className="unju-stamp" style={{ color: c.color, borderColor: c.color, background: c.bg, fontSize: size === "small" ? 9 : 10 }}><Icon name="stamp" size={size === "small" ? 10 : 11} /> {c.label}</span>;
}
function EstadoPill({ estado }) {
  const map = { pendiente: { color: "var(--ink-soft)", bg: "var(--paper-dark)" }, en_progreso: { color: "var(--navy)", bg: "#DCE3E8" }, finalizada: { color: "var(--baja)", bg: "var(--baja-bg)" } };
  const s = map[estado];
  return <span className="font-mono" style={{ color: s.color, background: s.bg, fontSize: 10, padding: "3px 7px", borderRadius: 2, letterSpacing: ".04em" }}>{ESTADO[estado].toUpperCase()}</span>;
}
function ProgressBar({ value }) {
  return <div style={{ background: "var(--paper-dark)", height: 6, borderRadius: 3, overflow: "hidden", border: "1px solid var(--line)" }}><div style={{ width: `${value}%`, height: "100%", background: "var(--navy)" }} /></div>;
}
function Header({ user, areas, onLogout }) {
  const roleLabel = { admin: "Administrador/a", director: "Dirección", area: "Responsable de área" }[user.rol];
  const areaName = user.areaId ? areas.find((a) => a.id === user.areaId)?.nombre : null;
  return (
    <div className="unju-card" style={{ borderLeft: "5px solid var(--seal)" }}>
      <div className="flex items-center justify-between px-4 py-3">
        <div>
          <div className="font-display" style={{ fontSize: 17, fontWeight: 600 }}>Secretaría de Administración</div>
          <div className="font-mono" style={{ fontSize: 11, color: "var(--ink-soft)" }}>UNJU · {roleLabel}{areaName ? ` · ${areaName}` : ""} · {user.nombre}</div>
        </div>
        <button onClick={onLogout} className="flex items-center gap-1 px-2 py-1.5" style={{ color: "var(--ink-soft)" }}><Icon name="logout" size={17} /></button>
      </div>
    </div>
  );
}
function BottomNav({ tabs, active, onChange }) {
  return (
    <div className="unju-card" style={{ position: "sticky", bottom: 0, borderTop: "1px solid var(--line)" }}>
      <div className="flex">
        {tabs.map((t) => (
          <button key={t.key} onClick={() => onChange(t.key)} className="flex-1 flex flex-col items-center gap-1 py-2.5" style={{ color: active === t.key ? "var(--navy)" : "var(--ink-soft)", borderTop: active === t.key ? "2px solid var(--navy)" : "2px solid transparent" }}>
            <Icon name={t.icon} size={19} sw={active === t.key ? 2.2 : 1.7} />
            <span className="font-mono" style={{ fontSize: 9.5, letterSpacing: ".03em" }}>{t.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

/* ---------------- Login ---------------- */
function Login({ users, onLogin }) {
  const [usuario, setUsuario] = useState("");
  const [clave, setClave] = useState("");
  const [error, setError] = useState("");
  const submit = (e) => {
    e.preventDefault();
    const u = users.find((x) => x.usuario === usuario.trim());
    if (!u || u.clave !== clave) { setError("Usuario o contraseña incorrectos."); return; }
    setError(""); onLogin(u);
  };
  return (
    <div className="unju-root flex items-center justify-center" style={{ minHeight: "100vh", padding: 20 }}>
      <div className="unju-card w-full" style={{ maxWidth: 380, borderTop: "5px solid var(--seal)", padding: 28 }}>
        <div className="flex items-center gap-2 mb-1" style={{ color: "var(--seal)" }}>
          <Icon name="stamp" size={20} />
          <span className="font-mono" style={{ fontSize: 11, letterSpacing: ".08em" }}>UNJU · REGISTRO DE GESTIÓN</span>
        </div>
        <h1 className="font-display" style={{ fontSize: 26, fontWeight: 700, marginTop: 4, marginBottom: 2 }}>Secretaría de<br />Administración</h1>
        <p style={{ fontSize: 13, color: "var(--ink-soft)", marginBottom: 20 }}>Seguimiento de actividades por área</p>
        <form onSubmit={submit} className="flex flex-col gap-3">
          <div>
            <label className="font-mono" style={{ fontSize: 10, color: "var(--ink-soft)", letterSpacing: ".05em" }}>USUARIO</label>
            <input className="unju-input w-full px-3 py-2 mt-1" style={{ fontSize: 14 }} value={usuario} onChange={(e) => setUsuario(e.target.value)} placeholder="p. ej. efarfan" />
          </div>
          <div>
            <label className="font-mono" style={{ fontSize: 10, color: "var(--ink-soft)", letterSpacing: ".05em" }}>CONTRASEÑA</label>
            <input type="password" className="unju-input w-full px-3 py-2 mt-1" style={{ fontSize: 14 }} value={clave} onChange={(e) => setClave(e.target.value)} placeholder="••••" />
          </div>
          {error && <div style={{ color: "var(--alta)", fontSize: 12.5 }}>{error}</div>}
          <button type="submit" className="font-mono mt-1" style={{ background: "var(--navy)", color: "var(--paper)", padding: "10px 0", fontSize: 12, letterSpacing: ".05em" }}>INGRESAR</button>
        </form>
        <div className="unju-divider mt-5 pt-4">
          <div className="font-mono mb-2" style={{ fontSize: 10, color: "var(--ink-soft)", letterSpacing: ".05em" }}>ACCESOS DE PRUEBA (clave: 1234)</div>
          <div className="flex flex-col gap-1.5">
            {users.map((u) => (
              <button key={u.id} onClick={() => { setUsuario(u.usuario); setClave("1234"); }} className="flex items-center justify-between px-2.5 py-1.5" style={{ background: "var(--paper)", border: "1px solid var(--line)", fontSize: 12 }}>
                <span>{u.nombre}</span><span className="font-mono" style={{ fontSize: 10, color: "var(--ink-soft)" }}>{u.usuario}</span>
              </button>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------- Detalle de tarea ---------------- */
function TaskDetail({ task, area, user, onClose, onUpdate }) {
  const [comentario, setComentario] = useState("");
  const [tipoComentario, setTipoComentario] = useState("comentario");
  const [avance, setAvance] = useState(task.avance);
  const [estado, setEstado] = useState(task.estado);
  const [criticidad, setCriticidad] = useState(task.criticidad);
  const [prorroga, setProrroga] = useState({ fecha: "", motivo: "" });
  const [showProrroga, setShowProrroga] = useState(false);
  const isAdmin = user.rol === "admin", isDirector = user.rol === "director", isArea = user.rol === "area";
  const overdue = daysLeft(task.fechaLimite) < 0 && task.estado !== "finalizada";

  const addComentario = () => {
    if (!comentario.trim()) return;
    const nuevo = { autor: user.nombre, rol: user.rol, fecha: new Date().toISOString().slice(0, 10), texto: comentario.trim(), tipo: isDirector ? tipoComentario : "comentario" };
    onUpdate({ ...task, comentarios: [...task.comentarios, nuevo] }); setComentario("");
  };
  const applyCriticidad = (c) => { setCriticidad(c); onUpdate({ ...task, criticidad: c }); };
  const applyAvanceEstado = () => onUpdate({ ...task, avance: Number(avance), estado });
  const solicitarProrroga = () => {
    if (!prorroga.fecha || !prorroga.motivo.trim()) return;
    onUpdate({ ...task, fechaLimite: prorroga.fecha, historial: [...task.historial, { fechaAnterior: task.fechaLimite, fechaNueva: prorroga.fecha, motivo: prorroga.motivo.trim() }] });
    setShowProrroga(false); setProrroga({ fecha: "", motivo: "" });
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(32,48,61,0.45)", zIndex: 50, display: "flex", alignItems: "flex-end" }} onClick={onClose}>
      <div className="unju-card unju-scrollbar" style={{ width: "100%", maxHeight: "88vh", overflowY: "auto", borderRadius: "10px 10px 0 0", borderBottom: "none", margin: "0 auto", maxWidth: 480 }} onClick={(e) => e.stopPropagation()}>
        <div className="flex items-start justify-between px-4 pt-4 pb-2" style={{ borderBottom: "1px solid var(--line)" }}>
          <div style={{ paddingRight: 10 }}>
            <div className="font-mono" style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>{area?.nombre} · {fmtDate(task.fechaLimite)}</div>
            <div className="font-display" style={{ fontSize: 18, fontWeight: 600, lineHeight: 1.25 }}>{task.titulo}</div>
          </div>
          <button onClick={onClose}><Icon name="x" size={20} color="var(--ink-soft)" /></button>
        </div>
        <div className="px-4 py-3 flex flex-col gap-4">
          <p style={{ fontSize: 13.5, color: "var(--ink-soft)" }}>{task.descripcion}</p>
          <div className="flex flex-wrap gap-2 items-center">
            <StampBadge crit={criticidad} /><EstadoPill estado={estado} />
            {overdue && <span className="unju-stamp" style={{ color: "var(--alta)", borderColor: "var(--alta)", background: "var(--alta-bg)" }}><Icon name="alert" size={11} /> Vencida</span>}
          </div>
          <div>
            <div className="flex justify-between mb-1"><span className="font-mono" style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>AVANCE</span><span className="font-mono" style={{ fontSize: 10.5 }}>{avance}%</span></div>
            <ProgressBar value={avance} />
          </div>
          <div className="grid grid-cols-2 gap-3 font-mono" style={{ fontSize: 11.5 }}>

/* ---------------- Formulario de tarea ---------------- */

    <div style={{ position: "fixed", inset: 0, background: "rgba(32,48,61,0.45)", zIndex: 50, display: "flex", alignItems: "flex-end" }} onClick={onClose}>

        <div className="flex items-center justify-between px-4 pt-4 pb-3" style={{ borderBottom: "1px solid var(--line)" }}>
          <div className="font-display" style={{ fontSize: 17, fontWeight: 600 }}>{initial ? "Editar tarea" : "Nueva tarea"}</div>

            <select className="unju-input w-full px-2.5 py-2 mt-1" style={{ fontSize: 13 }} value={form.areaId} onChange={(e) => setForm({ ...form, areaId: e.target.value, responsable: "" })}>
              {areas.map((a) => <option key={a.id} value={a.id}>{a.nombre}</option>)}

          <div><label className="font-mono" style={{ fontSize: 10, color: "var(--ink-soft)" }}>DESCRIPCIÓN</label>
            <textarea rows={2} className="unju-input w-full px-2.5 py-2 mt-1" style={{ fontSize: 13 }} value={form.descripcion} onChange={(e) => setForm({ ...form, descripcion: e.target.value })} /></div>

            <div><label className="font-mono" style={{ fontSize: 10, color: "var(--ink-soft)" }}>CRITICIDAD</label>

/* ---------------- Fila de tarea ---------------- */
function TaskRow({ task, area, onClick }) {
  const dl = daysLeft(task.fechaLimite);
  const overdue = dl < 0 && task.estado !== "finalizada";
  return (
    <button onClick={onClick} className="unju-card w-full text-left px-3.5 py-3 flex items-center gap-3" style={{ borderLeft: `4px solid ${CRIT[task.criticidad].color}` }}>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div className="flex items-center gap-2 flex-wrap mb-1"><span className="font-mono" style={{ fontSize: 10, color: "var(--ink-soft)" }}>{area?.nombre}</span><EstadoPill estado={task.estado} /></div>
        <div style={{ fontSize: 13.5, fontWeight: 600, lineHeight: 1.25 }}>{task.titulo}</div>
        <div className="flex items-center gap-2 mt-1.5"><div style={{ flex: 1, maxWidth: 120 }}><ProgressBar value={task.avance} /></div><span className="font-mono" style={{ fontSize: 10, color: "var(--ink-soft)" }}>{task.avance}%</span></div>
        <div className="flex items-center gap-2 mt-1.5"><StampBadge crit={task.criticidad} size="small" /><span className="font-mono" style={{ fontSize: 10, color: overdue ? "var(--alta)" : "var(--ink-soft)" }}>{overdue ? `Vencida hace ${Math.abs(dl)}d` : `Vence en ${dl}d — ${fmtDate(task.fechaLimite)}`}</span></div>
      </div>
      <Icon name="chevron" size={16} color="var(--ink-soft)" />
    </button>
  );
}

/* ---------------- Resumen (director + admin) ---------------- */
function ResumenView({ tasks, areas }) {
  const critData = Object.keys(CRIT).map((c) => ({ name: CRIT[c].label, value: tasks.filter((t) => t.criticidad === c).length, color: CRIT[c].color }));
  const areaData = areas.map((a) => ({ name: a.nombre.split(" ")[0], total: tasks.filter((t) => t.areaId === a.id).length }));
  const vencidas = tasks.filter((t) => daysLeft(t.fechaLimite) < 0 && t.estado !== "finalizada").length;
  const finalizadas = tasks.filter((t) => t.estado === "finalizada").length;
  const enCurso = tasks.filter((t) => t.estado === "en_progreso").length;
  const kpis = [
    { label: "Total tareas", value: tasks.length, icon: "clipboard" },
    { label: "En curso", value: enCurso, icon: "clock" },
    { label: "Vencidas", value: vencidas, icon: "alert" },
    { label: "Finalizadas", value: finalizadas, icon: "check" },
  ];
  return (
    <div className="flex flex-col gap-4 px-4 py-4">
      <div className="grid grid-cols-2 gap-3">
        {kpis.map((k) => (
          <div key={k.label} className="unju-card px-3.5 py-3">
            <Icon name={k.icon} size={16} color="var(--ink-soft)" />
            <div className="font-display" style={{ fontSize: 24, fontWeight: 600, marginTop: 4 }}>{k.value}</div>
            <div className="font-mono" style={{ fontSize: 10, color: "var(--ink-soft)" }}>{k.label.toUpperCase()}</div>
          </div>
        ))}
      </div>
      <div className="unju-card px-3.5 py-3">
        <div className="font-mono mb-2" style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>TAREAS POR CRITICIDAD</div>
        <ResponsiveContainer width="100%" height={180}>
          <PieChart><Pie data={critData} dataKey="value" nameKey="name" innerRadius={40} outerRadius={65} paddingAngle={3}>{critData.map((d, i) => <Cell key={i} fill={d.color} />)}</Pie><Tooltip /><Legend wrapperStyle={{ fontSize: 11 }} /></PieChart>
        </ResponsiveContainer>
      </div>
      <div className="unju-card px-3.5 py-3">
        <div className="font-mono mb-2" style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>TAREAS POR ÁREA</div>
        <ResponsiveContainer width="100%" height={190}>
          <BarChart data={areaData}><CartesianGrid strokeDasharray="3 3" stroke="var(--line)" /><XAxis dataKey="name" tick={{ fontSize: 10 }} interval={0} angle={-20} textAnchor="end" height={50} /><YAxis allowDecimals={false} tick={{ fontSize: 10 }} /><Tooltip /><Bar dataKey="total" fill="var(--navy)" radius={[3, 3, 0, 0]} /></BarChart>
        </ResponsiveContainer>
      </div>
    </div>
  );
}

/* ---------------- Línea de tiempo ---------------- */
function TimelineView({ tasks, areas, onOpen }) {
  const sorted = [...tasks].filter(t => t.estado !== "finalizada").sort((a, b) => a.fechaLimite.localeCompare(b.fechaLimite));
  return (
    <div className="px-4 py-4">
      <div className="font-mono mb-3" style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>LÍNEA DE TIEMPO — TAREAS ABIERTAS</div>
      <div style={{ position: "relative", paddingLeft: 18 }}>
        <div style={{ position: "absolute", left: 5, top: 4, bottom: 4, width: 2, background: "var(--line)" }} />
        <div className="flex flex-col gap-3">
          {sorted.map((t) => {
            const area = areas.find((a) => a.id === t.areaId);
            const overdue = daysLeft(t.fechaLimite) < 0;
            return (
              <div key={t.id} style={{ position: "relative" }}>
                <div style={{ position: "absolute", left: -18, top: 6, width: 10, height: 10, borderRadius: "50%", background: CRIT[t.criticidad].color, border: "2px solid var(--paper)" }} />
                <button onClick={() => onOpen(t)} className="unju-card w-full text-left px-3 py-2.5">
                  <div className="flex items-center justify-between"><span className="font-mono" style={{ fontSize: 10.5, color: overdue ? "var(--alta)" : "var(--ink-soft)" }}>{fmtDate(t.fechaLimite)}</span><StampBadge crit={t.criticidad} size="small" /></div>
                  <div style={{ fontSize: 13, fontWeight: 600, marginTop: 2 }}>{t.titulo}</div>
                  <div className="font-mono" style={{ fontSize: 10, color: "var(--ink-soft)", marginTop: 2 }}>{area?.nombre} · {t.responsable}</div>
                </button>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ---------------- Exportar ---------------- */
function exportExcel(tasks, areas) {
  const rows = tasks.map((t) => ({ Área: areas.find((a) => a.id === t.areaId)?.nombre || "", Tarea: t.titulo, Responsable: t.responsable, Criticidad: CRIT[t.criticidad].label, Estado: ESTADO[t.estado], "Fecha límite": fmtDate(t.fechaLimite), "Avance (%)": t.avance, "Reprogramaciones": t.historial.length }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = [{ wch: 16 }, { wch: 40 }, { wch: 18 }, { wch: 10 }, { wch: 12 }, { wch: 13 }, { wch: 11 }, { wch: 15 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Tareas");
  const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  const blob = new Blob([out], { type: "application/octet-stream" });
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = "tareas_secretaria_administracion.xlsx"; a.click(); URL.revokeObjectURL(url);
}
function exportWord(tasks, areas) {
  const rows = tasks.map((t) => `<tr><td>${areas.find((a) => a.id === t.areaId)?.nombre || ""}</td><td>${t.titulo}</td><td>${t.responsable}</td><td>${CRIT[t.criticidad].label}</td><td>${ESTADO[t.estado]}</td><td>${fmtDate(t.fechaLimite)}</td><td>${t.avance}%</td></tr>`).join("");
  const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset="utf-8"><title>Reporte de tareas</title></head><body style="font-family:Calibri,sans-serif;"><h2>Secretaría de Administración — UNJU</h2><p>Reporte de actividades por área — ${new Date().toLocaleDateString("es-AR")}</p><table border="1" cellspacing="0" cellpadding="5" style="border-collapse:collapse;font-size:11px;"><tr style="background:#22303F;color:#fff;"><th>Área</th><th>Tarea</th><th>Responsable</th><th>Criticidad</th><th>Estado</th><th>Fecha límite</th><th>Avance</th></tr>${rows}</table></body></html>`;
  const blob = new Blob(["\ufeff", html], { type: "application/msword" });
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = "reporte_secretaria_administracion.doc"; a.click(); URL.revokeObjectURL(url);
}

        {users.map((u) => (
          <div key={u.id} className="unju-card px-3.5 py-2.5 flex items-center justify-between">
            <div><div style={{ fontSize: 13.5 }}>{u.nombre}</div><div className="font-mono" style={{ fontSize: 10, color: "var(--ink-soft)" }}>{u.usuario} · {{ admin: "Administrador", director: "Dirección", area: "Responsable" }[u.rol]}{u.areaId ? ` · ${areas.find(a => a.id === u.areaId)?.nombre}` : ""}</div></div>
          </div>
        ))}
      </div>
      <div className="unju-card px-3.5 py-3">
        <div className="font-mono mb-2" style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>CREAR USUARIO</div>
        <div className="flex flex-col gap-2">
          <input className="unju-input px-2.5 py-2" style={{ fontSize: 13 }} placeholder="Nombre completo" value={newUser.nombre} onChange={(e) => setNewUser({ ...newUser, nombre: e.target.value })} />
          <div className="grid grid-cols-2 gap-2">
            <input className="unju-input px-2.5 py-2" style={{ fontSize: 13 }} placeholder="Usuario" value={newUser.usuario} onChange={(e) => setNewUser({ ...newUser, usuario: e.target.value })} />
            <input className="unju-input px-2.5 py-2" style={{ fontSize: 13 }} placeholder="Contraseña" value={newUser.clave} onChange={(e) => setNewUser({ ...newUser, clave: e.target.value })} />
          </div>
          <div className="grid grid-cols-2 gap-2">
            <select className="unju-input px-2.5 py-2" style={{ fontSize: 13 }} value={newUser.rol} onChange={(e) => setNewUser({ ...newUser, rol: e.target.value })}>
              <option value="area">Responsable de área</option><option value="director">Dirección</option><option value="admin">Administrador</option>
            </select>
            <select className="unju-input px-2.5 py-2" style={{ fontSize: 13 }} disabled={newUser.rol !== "area"} value={newUser.areaId} onChange={(e) => setNewUser({ ...newUser, areaId: e.target.value })}>
              {areas.map((a) => <option key={a.id} value={a.id}>{a.nombre}</option>)}
            </select>
          </div>
          <button onClick={() => { if (!newUser.nombre.trim() || !newUser.usuario.trim()) return; setUsers([...users, { ...newUser, id: uid("u"), areaId: newUser.rol === "area" ? newUser.areaId : null }]); setNewUser({ nombre: "", usuario: "", clave: "1234", rol: "area", areaId: areas[0]?.id || "" }); }} className="font-mono" style={{ background: "var(--navy)", color: "var(--paper)", padding: "9px 0", fontSize: 11.5 }}>CREAR USUARIO</button>
        </div>
      </div>
    </div>
  );

  if (tab === "exportar") return (
    <div className="px-4 py-4 flex flex-col gap-3">
      <div className="font-mono mb-1" style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>DESCARGAR REPORTE ({tasks.length} tareas)</div>
      <button onClick={() => exportExcel(tasks, areas)} className="unju-card flex items-center gap-3 px-4 py-3.5 text-left">
        <Icon name="sheet" size={22} color="var(--baja)" /><div><div style={{ fontSize: 14, fontWeight: 600 }}>Exportar a Excel</div><div className="font-mono" style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>.xlsx — planilla completa de tareas</div></div>
      </button>
      <button onClick={() => exportWord(tasks, areas)} className="unju-card flex items-center gap-3 px-4 py-3.5 text-left">
        <Icon name="filetext" size={22} color="var(--navy)" /><div><div style={{ fontSize: 14, fontWeight: 600 }}>Exportar a Word</div><div className="font-mono" style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>.doc — reporte con formato de tabla</div></div>
      </button>
    </div>
  );

  return null;
}

/* ---------------- Panel Dirección ---------------- */
function DirectorPanel({ tab, tasks, areas, openTask }) {
  if (tab === "resumen") return <ResumenView tasks={tasks} areas={areas} />;
  if (tab === "timeline") return <TimelineView tasks={tasks} areas={areas} onOpen={openTask} />;
  if (tab === "tareas") return (
    <div className="px-4 py-4 flex flex-col gap-2.5">
      <div className="font-mono mb-1" style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>{tasks.length} TAREAS · TODAS LAS ÁREAS</div>
      {tasks.map((t) => <TaskRow key={t.id} task={t} area={areas.find(a=>a.id===t.areaId)} onClick={() => openTask(t)} />)}
    </div>
  );
  return null;
}

/* ---------------- Panel de Área ---------------- */
function AreaPanel({ tasks, areas, user, openTask }) {
  const mine = tasks.filter((t) => t.responsable === user.nombre);
  const area = areas.find((a) => a.id === user.areaId);
  const pendientes = mine.filter(t => t.estado !== "finalizada").length;
  return (
    <div className="px-4 py-4">
      <div className="unju-card px-3.5 py-3 mb-4" style={{ borderLeft: "4px solid var(--gold)" }}>
        <div className="font-mono" style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>ÁREA</div>
        <div className="font-display" style={{ fontSize: 17, fontWeight: 600 }}>{area?.nombre}</div>
        <div className="font-mono mt-1" style={{ fontSize: 11, color: "var(--ink-soft)" }}>{pendientes} tareas abiertas de {mine.length}</div>
      </div>
      <div className="font-mono mb-2" style={{ fontSize: 10.5, color: "var(--ink-soft)" }}>MIS TAREAS</div>
      <div className="flex flex-col gap-2.5">
        {mine.length === 0 && <div style={{ fontSize: 13, color: "var(--ink-soft)" }}>No tenés tareas asignadas por el momento.</div>}
        {mine.map((t) => <TaskRow key={t.id} task={t} area={area} onClick={() => openTask(t)} />)}
      </div>
    </div>
  );
}

/* ---------------- App ---------------- */
function App() {
  const [users, setUsers] = useState(USER_SEED);
  const [areas, setAreas] = useState(AREA_SEED);
  const [tasks, setTasks] = useState(TASK_SEED);
  const [user, setUser] = useState(null);
  const [tab, setTab] = useState("resumen");
  const [openTaskObj, setOpenTaskObj] = useState(null);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    const saved = loadState();
    if (saved) { setUsers(saved.users || USER_SEED); setAreas(saved.areas || AREA_SEED); setTasks(saved.tasks || TASK_SEED); }
    setReady(true);
  }, []);
  useEffect(() => { if (ready) saveState({ users, areas, tasks }); }, [users, areas, tasks, ready]);

  const openTask = useCallback((t) => setOpenTaskObj(t), []);
  const updateTask = useCallback((updated) => { setTasks((prev) => prev.map((t) => (t.id === updated.id ? updated : t))); setOpenTaskObj(updated); }, []);
  const login = (u) => { setUser(u); setTab(u.rol === "area" ? "mis-tareas" : "resumen"); };

  if (!ready) return null;
  if (!user) return <div className="unju-root"><Login users={users} onLogin={login} /></div>;

  const tabsByRole = {
    admin: [
      { key: "resumen", label: "Resumen", icon: "dashboard" },
      { key: "areas", label: "Áreas", icon: "building" },
      { key: "usuarios", label: "Usuarios", icon: "users" },
      { key: "tareas", label: "Tareas", icon: "clipboard" },
      { key: "exportar", label: "Exportar", icon: "download" },
    ],
    director: [
      { key: "resumen", label: "Resumen", icon: "dashboard" },
      { key: "timeline", label: "Línea de tiempo", icon: "calendar" },
      { key: "tareas", label: "Tareas", icon: "clipboard" },
    ],
    area: [{ key: "mis-tareas", label: "Mis tareas", icon: "clipboard" }],
  };
  const currentTask = openTaskObj ? tasks.find((t) => t.id === openTaskObj.id) : null;

  return (
    <div className="unju-root" style={{ display: "flex", flexDirection: "column" }}>
      <div style={{ maxWidth: 480, margin: "0 auto", width: "100%", display: "flex", flexDirection: "column", minHeight: "100vh" }}>
        <Header user={user} areas={areas} onLogout={() => setUser(null)} />
        <div style={{ flex: 1, overflowY: "auto" }} className="unju-scrollbar">
          {user.rol === "admin" && <AdminPanel tab={tab} tasks={tasks} areas={areas} users={users} setTasks={setTasks} setAreas={setAreas} setUsers={setUsers} openTask={openTask} />}
          {user.rol === "director" && <DirectorPanel tab={tab} tasks={tasks} areas={areas} openTask={openTask} />}
          {user.rol === "area" && <AreaPanel tasks={tasks} areas={areas} user={user} openTask={openTask} />}
        </div>
        <BottomNav tabs={tabsByRole[user.rol]} active={tab} onChange={setTab} />
      </div>
      {currentTask && <TaskDetail task={currentTask} area={areas.find((a) => a.id === currentTask.areaId)} user={user} onClose={() => setOpenTaskObj(null)} onUpdate={updateTask} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
